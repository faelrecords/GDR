<!--
  ================================================================
  02 — Hero
  ================================================================
  EDITE: título em h1, subtítulo em .hero-lead e texto/link do botão.
  IMAGEM PRINCIPAL: altere o src dentro de .hero-visual.
  LOGOS: adicione ou remova imagens somente dentro de .client-logo-list; o loop é automático.
  DICA: edite textos e URLs, mas preserve classes e atributos data-*.
-->
<section class="hero" id="inicio">
      <div class="container hero-shell">
        <div class="hero-grid">
          <div class="hero-copy" data-reveal>
          <h1>Sua empresa pode <span>crescer</span><br>sem depender do improviso.</h1>
          <p class="hero-lead">A <strong class="hero-brand-mark">GDR</strong> transforma estratégia em gestão, execução e <strong>resultado para construir empresas mais organizadas e lucrativas.</strong></p>
          <div class="hero-actions">
            <a class="button button-hero-primary button-hero-figma" href="#diagnostico">&gt;&gt; Clique aqui e dê o primeiro passo &lt;&lt;</a>
          </div>
          </div>

          <figure class="hero-visual" data-reveal>
            <picture>
              <img src="https://gdr.vibecodex.pro/assets/hero-consultores-gdr-figma.png?v=20260904-39" width="812" height="632" alt="Equipe de consultores da GDR" fetchpriority="high" decoding="async">
            </picture>
          </figure>
        </div>
      </div>
      <div class="container client-logos" aria-label="Empresas atendidas pela GDR" data-reveal>
        <!--
          LOGOS DOS CLIENTES
          Para adicionar, remover ou trocar uma empresa, edite apenas as imagens abaixo.
          O JavaScript cria automaticamente a cópia necessária para o movimento infinito.
        -->
        <div class="client-logo-list">
          <img src="https://gdr.vibecodex.pro/assets/logo-loja-sao-jose.webp" width="610" height="398" alt="Loja São José" loading="lazy" decoding="async">
          <img src="https://gdr.vibecodex.pro/assets/logo-r2-motos.webp" width="571" height="272" alt="R2 Motos" loading="lazy" decoding="async">
          <img src="https://gdr.vibecodex.pro/assets/logo-jp-distribuidora.webp" width="571" height="272" alt="JP Distribuidora" loading="lazy" decoding="async">
          <img src="https://gdr.vibecodex.pro/assets/logo-lagoacar.webp" width="571" height="272" alt="Lagoacar" loading="lazy" decoding="async">
          <img src="https://gdr.vibecodex.pro/assets/logo-sabor-di-casa.webp" width="571" height="272" alt="Sabor Di Casa" loading="lazy" decoding="async">
          <img src="https://gdr.vibecodex.pro/assets/logo-arcos-agro.webp" width="571" height="272" alt="Arcos Agropecuária" loading="lazy" decoding="async">
          <img src="https://gdr.vibecodex.pro/assets/logo-fatima-calcados.webp" width="542" height="240" alt="Fátima Calçados" loading="lazy" decoding="async">
          <img src="https://gdr.vibecodex.pro/assets/logo-mega-camping.webp" width="571" height="272" alt="Mega Camping" loading="lazy" decoding="async">
        </div>
      </div>
    </section>
